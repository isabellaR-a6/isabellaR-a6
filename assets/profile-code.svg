<svg width="760" height="756" viewBox="0 0 760 756" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
    .keyword  { fill: #c792ea; }
    .func     { fill: #82aaff; }
    .prop     { fill: #f78c6c; }
    .string   { fill: #c3e88d; }
    .punct    { fill: #89ddff; }
    .comment  { fill: #676e95; font-style: italic; }
    .plain    { fill: #d6deeb; }
    .lineno   { fill: #4b5265; }
  </style>

  <g filter="url(#shadow)">
    <!-- Fundo Card -->
    <rect x="10" y="10" width="740" height="736" rx="16" fill="#1a1a27" stroke="#33334a" stroke-width="1"/>

    <!-- Linha Gutter (Números) -->
    <line x1="108" y1="30" x2="108" y2="746" stroke="#2a2a3d" stroke-width="1"/>
    <g class="mono lineno" font-size="14" text-anchor="end">
      <text x="88" y="76">1</text>
      <text x="88" y="108">2</text>
      <text x="88" y="140">3</text>
      <text x="88" y="172">4</text>
      <text x="88" y="204">5</text>
      <text x="88" y="236">6</text>
      <text x="88" y="268">7</text>
      <text x="88" y="300">8</text>
      <text x="88" y="332">9</text>
      <text x="88" y="364">10</text>
      <text x="88" y="396">11</text>
      <text x="88" y="428">12</text>
      <text x="88" y="460">13</text>
      <text x="88" y="492">14</text>
      <text x="88" y="524">15</text>
      <text x="88" y="556">16</text>
      <text x="88" y="588">17</text>
      <text x="88" y="620">18</text>
      <text x="88" y="652">19</text>
      <text x="88" y="684">20</text>
      <text x="88" y="716">21</text>
    </g>

    <!-- PRINT BUSCADO VIA URL RAW DO GITHUB -->
    <g transform="translate(130, 35)">
      <image 
        href="https://raw.githubusercontent.com/isabellaR-a6/isabellaR-a6/main/assets/print.png" 
        x="0" 
        y="0" 
        width="580" 
        height="190" 
        preserveAspectRatio="xMidYMid meet" 
      />
    </g>

    <!-- CODE JS -->
    <g class="mono" font-size="15.5">
      <text x="126" y="268"><tspan class="keyword">const</tspan><tspan class="plain"> isabella </tspan><tspan class="punct">=</tspan><tspan class="plain"> {</tspan></text>

      <text x="126" y="300"><tspan class="prop">  role</tspan><tspan class="punct">:</tspan><tspan class="string"> "Estudante de Desenvolvimento de Sistemas"</tspan><tspan class="punct">,</tspan></text>

      <text x="126" y="348"><tspan class="prop">  frontend</tspan><tspan class="punct">: [</tspan><tspan class="string">"HTML"</tspan><tspan class="punct">, </tspan><tspan class="string">"CSS"</tspan><tspan class="punct">, </tspan><tspan class="string">"JavaScript"</tspan><tspan class="punct">, </tspan><tspan class="string">"Bootstrap"</tspan><tspan class="punct">],</tspan></text>

      <text x="126" y="380"><tspan class="prop">  backend</tspan><tspan class="punct">:  [</tspan><tspan class="string">"PHP"</tspan><tspan class="punct">, </tspan><tspan class="string">"MySQL"</tspan><tspan class="punct">],</tspan></text>

      <text x="126" y="412"><tspan class="prop">  tools</tspan><tspan class="punct">:    [</tspan><tspan class="string">"Git"</tspan><tspan class="punct">, </tspan><tspan class="string">"GitHub"</tspan><tspan class="punct">, </tspan><tspan class="string">"Azure"</tspan><tspan class="punct">],</tspan></text>

      <text x="126" y="460"><tspan class="prop">  links</tspan><tspan class="punct">: {</tspan></text>
      <text x="126" y="492"><tspan class="prop">    linkedin</tspan><tspan class="punct">:</tspan><tspan class="string"> "linkedin.com/in/isabella-radael"</tspan><tspan class="punct">,</tspan></text>
      <text x="126" y="524"><tspan class="prop">    github</tspan><tspan class="punct">:</tspan><tspan class="string"> "github.com/isabellaR-a6"</tspan></text>
      <text x="126" y="556" class="punct">  }</text>

      <text x="126" y="588" class="punct">};</text>

      <text x="126" y="636"><tspan class="func">console</tspan><tspan class="punct">.</tspan><tspan class="func">log</tspan><tspan class="punct">(</tspan><tspan class="keyword">`Oi, eu sou a ${</tspan><tspan class="plain">isabella</tspan><tspan class="punct">.</tspan><tspan class="prop">role</tspan><tspan class="keyword">}`</tspan><tspan class="punct">);</tspan></text>

      <text x="126" y="684"><tspan class="keyword">export default</tspan><tspan class="plain"> isabella</tspan><tspan class="punct">;</tspan></text>

      <text x="126" y="724" class="comment">// obrigada pela visita ✨</text>
    </g>
  </g>
</svg>
