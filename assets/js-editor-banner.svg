<svg width="760" height="460" viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="topbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a3d"/>
      <stop offset="100%" stop-color="#232334"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f7df1e"/>
      <stop offset="100%" stop-color="#f0db4f"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
    .keyword  { fill: #c792ea; }
    .func     { fill: #82aaff; }
    .prop     { fill: #f78c6c; }
    .string   { fill: #c3e88d; }
    .punct    { fill: #89ddff; }
    .comment  { fill: #676e95; font-style: italic; }
    .plain    { fill: #d6deeb; }
    .lineno   { fill: #4b5265; }
  </style>

  <!-- window -->
  <g filter="url(#shadow)">
    <rect x="10" y="10" width="740" height="440" rx="16" fill="#1a1a27" stroke="#33334a" stroke-width="1"/>

    <!-- title bar -->
    <path d="M10 26 a16 16 0 0 1 16 -16 h708 a16 16 0 0 1 16 16 v32 h-740 z" fill="url(#topbar)"/>
    <circle cx="38" cy="42" r="6.5" fill="#ff5f56"/>
    <circle cx="62" cy="42" r="6.5" fill="#ffbd2e"/>
    <circle cx="86" cy="42" r="6.5" fill="#27c93f"/>

    <!-- file tab -->
    <rect x="120" y="58" width="130" height="26" rx="6" fill="#1a1a27"/>
    <circle cx="136" cy="71" r="5" fill="url(#glow)"/>
    <text x="148" y="76" class="mono plain" font-size="13">profile.js</text>

    <!-- line numbers gutter -->
    <line x1="108" y1="84" x2="108" y2="450" stroke="#2a2a3d" stroke-width="1"/>
    <g class="mono lineno" font-size="14">
      <text x="88" y="120" text-anchor="end">1</text>
      <text x="88" y="152" text-anchor="end">2</text>
      <text x="88" y="184" text-anchor="end">3</text>
      <text x="88" y="216" text-anchor="end">4</text>
      <text x="88" y="248" text-anchor="end">5</text>
      <text x="88" y="280" text-anchor="end">6</text>
      <text x="88" y="312" text-anchor="end">7</text>
      <text x="88" y="344" text-anchor="end">8</text>
      <text x="88" y="376" text-anchor="end">9</text>
      <text x="88" y="408" text-anchor="end">10</text>
    </g>

    <!-- code, well spaced (32px line-height) -->
    <g class="mono" font-size="15.5">
      <text x="126" y="120"><tspan class="keyword">const</tspan><tspan class="plain"> isabella </tspan><tspan class="punct">=</tspan><tspan class="plain"> {</tspan></text>

      <text x="126" y="152"><tspan class="prop">  role</tspan><tspan class="punct">:</tspan><tspan class="string"> "Estudante de Desenvolvimento de Sistemas"</tspan><tspan class="punct">,</tspan></text>

      <text x="126" y="184"><tspan class="prop">  frontend</tspan><tspan class="punct">: [</tspan><tspan class="string">"HTML"</tspan><tspan class="punct">, </tspan><tspan class="string">"CSS"</tspan><tspan class="punct">, </tspan><tspan class="string">"JavaScript"</tspan><tspan class="punct">, </tspan><tspan class="string">"Bootstrap"</tspan><tspan class="punct">],</tspan></text>

      <text x="126" y="216"><tspan class="prop">  backend</tspan><tspan class="punct">: [</tspan><tspan class="string">"PHP"</tspan><tspan class="punct">, </tspan><tspan class="string">"MySQL"</tspan><tspan class="punct">],</tspan></text>

      <text x="126" y="248"><tspan class="prop">  tools</tspan><tspan class="punct">: [</tspan><tspan class="string">"Git"</tspan><tspan class="punct">, </tspan><tspan class="string">"GitHub"</tspan><tspan class="punct">, </tspan><tspan class="string">"Azure"</tspan><tspan class="punct">],</tspan></text>

      <text x="126" y="280"><tspan class="prop">  school</tspan><tspan class="punct">:</tspan><tspan class="string"> "SENAI — Técnico em Des. de Sistemas"</tspan><tspan class="punct">,</tspan></text>

      <text x="126" y="312"><tspan class="prop">  mindset</tspan><tspan class="punct">:</tspan><tspan class="string"> "sempre aprendendo 🏎️❤️"</tspan></text>

      <text x="126" y="344" class="punct">};</text>

      <text x="126" y="376"><tspan class="func">console</tspan><tspan class="punct">.</tspan><tspan class="func">log</tspan><tspan class="punct">(</tspan><tspan class="keyword">`Oi, eu sou a ${</tspan><tspan class="plain">isabella</tspan><tspan class="punct">.</tspan><tspan class="prop">role</tspan><tspan class="keyword">}`</tspan><tspan class="punct">);</tspan></text>

      <text x="126" y="408" class="comment">// obrigada pela visita ✨</text>
    </g>
  </g>
</svg>
